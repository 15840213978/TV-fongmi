name: Build FongMi TV

on:
  schedule:
    - cron: "0 */2 * * *" # 每2小时自动检查更新
  workflow_dispatch: # 允许手动触发
    inputs:
      force_build:
        description: 'Force build even if no changes detected'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Builder Repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Checkout FongMi Source
        uses: actions/checkout@v4
        with:
          repository: FongMi/TV
          ref: release
          path: FongMi-TV
          fetch-depth: 0

      - name: Setup Build Environment
        working-directory: FongMi-TV
        run: |
          # 写入 local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "storeFile=../app/build.gradle" >> local.properties
          echo "keyAlias=dummy" >> local.properties
          echo "storePassword=dummy" >> local.properties
          echo "keyPassword=dummy" >> local.properties

          # 赋予执行权限
          chmod +x gradlew

      - name: Build with Gradle
        working-directory: FongMi-TV
        run: |
          # 强行跳过报错的 dataBinding 任务，并加上 --continue 确保走完整个构建图
          ./gradlew assembleLeanbackDebug assembleMobileDebug \
            -x :app:dataBindingGenBaseClassesLeanbackDebug \
            -x :app:dataBindingGenBaseClassesMobileDebug \
            --continue --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always() # 即使构建失败，只要有产出的 APK 也传上来看看
        with:
          name: FongMi-APKs
          path: |
            FongMi-TV/app/build/outputs/apk/**/*.apk
