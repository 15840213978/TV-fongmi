name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # 允许你在 GitHub 网页上手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 关键修复：生成 local.properties，包含 Android SDK 路径以及用于 CI 的假签名信息
    # 这样 Gradle 在配置 signingConfigs 时就不会因为找不到文件报错
    - name: Create local.properties
      run: |
        cat <<EOF > local.properties
        sdk.dir=$ANDROID_HOME
        storeFile=${{ github.workspace }}/app/build.gradle
        keyAlias=dummy
        storePassword=dummy
        keyPassword=dummy
        EOF

    # 继续使用 assembleDebug，避免因没有真实签名导致 Release 构建失败
    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace

    # 上传生成的 APK 文件
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
